<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블리비 임시명찰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }

        /* 명찰 컨테이너 물리적 사이즈 고정 (가로 6.8cm, 세로 2.91cm) */
        .nametag-canvas {
            width: 6.8cm;
            height: 2.91cm;
            background-color: white;
            border: 1px solid #a1a1aa; /* 회색 테두리 */
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 0.2cm;
            position: relative;
            overflow: hidden;
        }

        /* 인쇄 전용 스타일 */
        @media print {
            body {
                background-color: white;
            }
            /* UI 요소 숨기기 */
            .no-print {
                display: none !important;
            }
            /* 프린트 영역 설정 */
            .print-area {
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
                padding: 0;
                border: 1px solid #000; /* 인쇄 시 테두리 선명하게 */
            }
            /* 페이지 여백 제거하여 정확한 사이즈로 인쇄되게 함 */
            @page {
                size: auto;
                margin: 0mm; 
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-10">

    <div class="w-full max-w-3xl bg-white rounded-xl shadow-lg overflow-hidden flex flex-col md:flex-row no-print">
        
        <!-- 왼쪽: 입력 폼 (편집창) -->
        <div class="w-full md:w-1/2 p-8 bg-gray-50 border-r border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                블리비홍대점 임시명찰
            </h1>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">직책 / 포지션</label>
                    <input type="text" id="positionInput" value="원장/의사" placeholder="코디네이터" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-black focus:border-black outline-none transition">
                    <p class="text-xs text-gray-400 mt-1">원장/의사 또는 코디네이터/간호조무사/피부관리사 입력</p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">이 름</label>
                    <input type="text" id="nameInput" value="" placeholder="김 블 리" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-black focus:border-black outline-none transition">
                    <p class="text-xs text-gray-400 mt-1">* 글자 사이에 공백을 넣어주세요.</p>
                </div>

                <div class="pt-4">
                    <button onclick="window.print()" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3 px-4 rounded-md shadow transition flex justify-center items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        명찰 인쇄
                    </button>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 실시간 미리보기 -->
        <div class="w-full md:w-1/2 p-8 flex flex-col items-center justify-center bg-gray-200">
            <h2 class="text-sm font-bold text-gray-500 mb-4 tracking-wider uppercase">실제크기 (6.8 x 2.91cm)</h2>
            
            <!-- 인쇄 시 이 부분만 출력됨 -->
            <div class="nametag-canvas print-area bg-white shadow-sm" id="nametagCanvas">
                
                <!-- 좌측 로고 영역 (비율 및 크기 확대) -->
                <div class="w-[48%] h-full flex justify-center items-center px-[0.1cm]">
                    <img id="logoDisplay" src="스크린샷 2026-08-10 134338.png" alt="velyB Logo" class="w-full h-auto max-h-[88%] object-contain" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
                    <!-- 파일 미인식 시 대체 로고 표시 -->
                    <div id="logoFallback" class="hidden w-full h-full items-center justify-center font-bold text-[0.8cm] tracking-tighter text-black select-none leading-none">
                        vely<span class="font-black">B</span>
                    </div>
                </div>

                <!-- 우측 텍스트 영역 -->
                <div class="w-[52%] h-full flex flex-col justify-center pl-[0.05cm] pr-[0.1cm]">
                    <!-- 직책 -->
                    <div id="positionDisplay" class="text-[0.48cm] text-gray-900 font-semibold leading-tight mb-[0.08cm] pl-[0.1cm]">
                        원장/의사
                    </div>
                    
                    <!-- 구분선 -->
                    <div class="border-b-2 border-black w-full mb-[0.12cm]"></div>
                    
                    <!-- 이름 -->
                    <div id="nameDisplay" class="text-[0.72cm] text-black font-extrabold leading-none tracking-widest pl-[0.1cm] whitespace-nowrap">
                        김 블 리
                    </div>
                </div>

            </div>
            
            <p class="text-xs text-gray-500 mt-6 text-center max-w-xs">
                인쇄 시 브라우저 설정에서 <strong>'배경 그래픽 인쇄'</strong>체크 후 <strong>'여백'을 '없음'</strong>설정해주세요.
            </p>
        </div>
    </div>

    <script>
        // DOM 요소 가져오기
        const positionInput = document.getElementById('positionInput');
        const nameInput = document.getElementById('nameInput');
        
        const positionDisplay = document.getElementById('positionDisplay');
        const nameDisplay = document.getElementById('nameDisplay');

        // 실시간 텍스트 업데이트 이벤트 리스너
        positionInput.addEventListener('input', (e) => {
            positionDisplay.textContent = e.target.value || ' ';
        });

        nameInput.addEventListener('input', (e) => {
            nameDisplay.textContent = e.target.value || ' ';
        });
    </script>
</body>
</html>
