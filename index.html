<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블리비 임시명찰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }

        /* 명찰 1개 물리적 규격 (가로 6.8cm, 세로 2.91cm) */
        .nametag-canvas {
            width: 6.8cm;
            height: 2.91cm;
            background-color: white;
            border: 1px solid #a1a1aa;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 0.1cm;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* 인쇄 스타일 설정 */
        @media print {
            body {
                background-color: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .no-print {
                display: none !important;
            }

            /* 인쇄 시 스케일 원복 및 A4 상단 배치 */
            .print-area {
                position: absolute !important;
                left: 1cm !important;
                top: 1cm !important;
                display: grid !important;
                grid-template-columns: repeat(2, 6.8cm) !important;
                gap: 0.4cm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: transparent !important;
                box-shadow: none !important;
                transform: none !important; /* 화면 확대 효과 원복 */
                border: none !important;
            }

            .nametag-canvas {
                border: 1px solid #000 !important;
                box-shadow: none !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            @page {
                size: A4 portrait;
                margin: 0mm; 
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 md:p-6">

    <!-- 메인 컨테이너: 좌측 슬림 폼 + 우측 대형 프리뷰 -->
    <div class="w-full max-w-[1600px] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col lg:flex-row no-print my-auto min-h-[85vh]">
        
        <!-- 왼쪽: 컴팩트 4개 명찰 입력 폼 (슬림 레이아웃) -->
        <div class="w-full lg:w-[320px] xl:w-[350px] p-4 bg-gray-50 border-r border-gray-200 flex flex-col justify-between flex-shrink-0">
            <div>
                <!-- 타이틀 -->
                <div class="mb-3 pb-2 border-b border-gray-200">
                    <h1 class="text-xl font-bold text-gray-900 tracking-tight">
                        블리비 임시명찰
                    </h1>
                    <p class="text-[11px] text-gray-500 mt-0.5">4개 동시 작성 및 일괄 인쇄</p>
                </div>

                <!-- 입력 항목 1~4 (슬림 스타일) -->
                <div class="space-y-2.5">
                    
                    <!-- 명찰 #1 -->
                    <div class="p-2.5 bg-white rounded-lg border border-gray-200 shadow-sm space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-gray-700">명찰 #1</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-medium text-gray-500 mb-0.5">직책</label>
                                <input type="text" id="pos1" value="원장/의사" placeholder="원장/의사" class="w-full px-2 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-black outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] font-medium text-gray-500 mb-0.5">이름</label>
                                <input type="text" id="name1" value="홍 하 린" placeholder="홍 하 린" class="w-full px-2 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-black outline-none">
                            </div>
                        </div>
                        <p class="text-[9.5px] text-gray-400">원장/의사 또는 코디네이터/간호조무사/피부관리사</p>
                    </div>

                    <!-- 명찰 #2 -->
                    <div class="p-2.5 bg-white rounded-lg border border-gray-200 shadow-sm space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-gray-700">명찰 #2</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-medium text-gray-500 mb-0.5">직책</label>
                                <input type="text" id="pos2" value="원장/의사" placeholder="원장/의사" class="w-full px-2 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-black outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] font-medium text-gray-500 mb-0.5">이름</label>
                                <input type="text" id="name2" value="변 윤 준" placeholder="변 윤 준" class="w-full px-2 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-black outline-none">
                            </div>
                        </div>
                        <p class="text-[9.5px] text-gray-400">원장/의사 또는 코디네이터/간호조무사/피부관리사</p>
                    </div>

                    <!-- 명찰 #3 -->
                    <div class="p-2.5 bg-white rounded-lg border border-gray-200 shadow-sm space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-gray-700">명찰 #3</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-medium text-gray-500 mb-0.5">직책</label>
                                <input type="text" id="pos3" value="코디네이터" placeholder="코디네이터" class="w-full px-2 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-black outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] font-medium text-gray-500 mb-0.5">이름</label>
                                <input type="text" id="name3" value="김 명 화" placeholder="김 명 화" class="w-full px-2 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-black outline-none">
                            </div>
                        </div>
                        <p class="text-[9.5px] text-gray-400">원장/의사 또는 코디네이터/간호조무사/피부관리사</p>
                    </div>

                    <!-- 명찰 #4 -->
                    <div class="p-2.5 bg-white rounded-lg border border-gray-200 shadow-sm space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-gray-700">명찰 #4</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-medium text-gray-500 mb-0.5">직책</label>
                                <input type="text" id="pos4" value="간호조무사" placeholder="간호조무사" class="w-full px-2 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-black outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] font-medium text-gray-500 mb-0.5">이름</label>
                                <input type="text" id="name4" value="송 수 진" placeholder="송 수 진" class="w-full px-2 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-black outline-none">
                            </div>
                        </div>
                        <p class="text-[9.5px] text-gray-400">원장/의사 또는 코디네이터/간호조무사/피부관리사</p>
                    </div>

                </div>
            </div>

            <!-- 하단 인쇄 버튼 -->
            <div class="pt-3 mt-3 border-t border-gray-200">
                <button onclick="window.print()" class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-2.5 px-3 rounded-lg shadow-md transition flex justify-center items-center text-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                    </svg>
                    명찰 인쇄
                </button>
            </div>
        </div>

        <!-- 오른쪽: 대형 확장 미리보기 패널 -->
        <div class="flex-1 p-6 md:p-10 lg:p-12 bg-gray-200 flex flex-col items-center justify-center overflow-auto min-h-[500px]">
            <div class="text-center mb-6">
                <span class="text-xs font-bold text-gray-500 uppercase tracking-wider bg-gray-300/70 px-3 py-1 rounded-full">실제 인쇄 미리보기</span>
            </div>
            
            <!-- 인쇄 영역 및 적절한 미리보기 래퍼 -->
            <div class="p-6 md:p-8 bg-gray-300/60 rounded-2xl border border-gray-300 flex items-center justify-center overflow-visible">
                
                <div class="print-area grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 my-auto transition-all">
                    
                    <!-- 명찰 1 Canvas -->
                    <div class="nametag-canvas shadow-md">
                        <div class="w-[52%] h-full flex justify-center items-center px-[0.02cm]">
                            <img src="스크린샷 2026-08-10 134338.png" alt="velyB Logo" class="w-[96%] h-auto max-h-[95%] object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="hidden w-full h-full items-center justify-center font-bold text-[0.95cm] tracking-tighter text-black select-none leading-none">vely<span class="font-bold">B</span></div>
                        </div>
                        <div class="w-[48%] h-full flex flex-col justify-center pl-[0.02cm] pr-[0.08cm]">
                            <div id="posDisplay1" class="text-[0.55cm] text-gray-900 font-bold leading-tight mb-[0.05cm] pl-[0.05cm] whitespace-nowrap">원장/의사</div>
                            <div class="border-b-2 border-black w-full mb-[0.08cm]"></div>
                            <div id="nameDisplay1" class="text-[0.82cm] text-black font-bold leading-none tracking-widest pl-[0.05cm] whitespace-nowrap">홍 하 린</div>
                        </div>
                    </div>

                    <!-- 명찰 2 Canvas -->
                    <div class="nametag-canvas shadow-md">
                        <div class="w-[52%] h-full flex justify-center items-center px-[0.02cm]">
                            <img src="스크린샷 2026-08-10 134338.png" alt="velyB Logo" class="w-[96%] h-auto max-h-[95%] object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="hidden w-full h-full items-center justify-center font-bold text-[0.95cm] tracking-tighter text-black select-none leading-none">vely<span class="font-bold">B</span></div>
                        </div>
                        <div class="w-[48%] h-full flex flex-col justify-center pl-[0.02cm] pr-[0.08cm]">
                            <div id="posDisplay2" class="text-[0.55cm] text-gray-900 font-bold leading-tight mb-[0.05cm] pl-[0.05cm] whitespace-nowrap">원장/의사</div>
                            <div class="border-b-2 border-black w-full mb-[0.08cm]"></div>
                            <div id="nameDisplay2" class="text-[0.82cm] text-black font-bold leading-none tracking-widest pl-[0.05cm] whitespace-nowrap">변 윤 준</div>
                        </div>
                    </div>

                    <!-- 명찰 3 Canvas -->
                    <div class="nametag-canvas shadow-md">
                        <div class="w-[52%] h-full flex justify-center items-center px-[0.02cm]">
                            <img src="스크린샷 2026-08-10 134338.png" alt="velyB Logo" class="w-[96%] h-auto max-h-[95%] object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="hidden w-full h-full items-center justify-center font-bold text-[0.95cm] tracking-tighter text-black select-none leading-none">vely<span class="font-bold">B</span></div>
                        </div>
                        <div class="w-[48%] h-full flex flex-col justify-center pl-[0.02cm] pr-[0.08cm]">
                            <div id="posDisplay3" class="text-[0.55cm] text-gray-900 font-bold leading-tight mb-[0.05cm] pl-[0.05cm] whitespace-nowrap">코디네이터</div>
                            <div class="border-b-2 border-black w-full mb-[0.08cm]"></div>
                            <div id="nameDisplay3" class="text-[0.82cm] text-black font-bold leading-none tracking-widest pl-[0.05cm] whitespace-nowrap">김 명 화</div>
                        </div>
                    </div>

                    <!-- 명찰 4 Canvas -->
                    <div class="nametag-canvas shadow-md">
                        <div class="w-[52%] h-full flex justify-center items-center px-[0.02cm]">
                            <img src="스크린샷 2026-08-10 134338.png" alt="velyB Logo" class="w-[96%] h-auto max-h-[95%] object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="hidden w-full h-full items-center justify-center font-bold text-[0.95cm] tracking-tighter text-black select-none leading-none">vely<span class="font-bold">B</span></div>
                        </div>
                        <div class="w-[48%] h-full flex flex-col justify-center pl-[0.02cm] pr-[0.08cm]">
                            <div id="posDisplay4" class="text-[0.55cm] text-gray-900 font-bold leading-tight mb-[0.05cm] pl-[0.05cm] whitespace-nowrap">간호조무사</div>
                            <div class="border-b-2 border-black w-full mb-[0.08cm]"></div>
                            <div id="nameDisplay4" class="text-[0.82cm] text-black font-bold leading-none tracking-widest pl-[0.05cm] whitespace-nowrap">송 수 진</div>
                        </div>
                    </div>

                </div>

            </div>

            <p class="text-xs text-gray-500 mt-8 text-center">
                명찰 사이즈에 맞게 (6.8cm x 2.91cm) 인쇄됩니다.
            </p>
        </div>
    </div>

    <script>
        // 4개 명찰 실시간 동기화
        [1, 2, 3, 4].forEach(index => {
            const posInput = document.getElementById(`pos${index}`);
            const nameInput = document.getElementById(`name${index}`);
            const posDisplay = document.getElementById(`posDisplay${index}`);
            const nameDisplay = document.getElementById(`nameDisplay${index}`);

            posInput.addEventListener('input', (e) => {
                posDisplay.textContent = e.target.value || '\u00A0';
            });

            nameInput.addEventListener('input', (e) => {
                nameDisplay.textContent = e.target.value || '\u00A0';
            });
        });
    </script>
</body>
</html>
